<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PageSift promo tile</title>
    <style>
      html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
      body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; background: linear-gradient(135deg, #6d5cff 0%, #4a37d8 65%, #3a2bb0 100%); display: flex; flex-direction: column; justify-content: center; padding: 0 34px; box-sizing: border-box; position: relative; }
      .row { display: flex; align-items: center; gap: 14px; }
      img { width: 64px; height: 64px; }
      h1 { margin: 0; font-size: 38px; letter-spacing: -0.5px; }
      p { margin: 14px 0 0; font-size: 19px; line-height: 1.3; font-weight: 600; }
      small { display: block; margin-top: 10px; font-size: 13px; opacity: 0.85; }
      .grid { position: absolute; right: -30px; bottom: -30px; width: 170px; opacity: 0.16; }
      .grid div { height: 16px; background: #fff; border-radius: 8px; margin: 10px 0; }
    </style>
  </head>
  <body>
    <div class="row"><img src="icons/icon128.png" alt="" /><h1>PageSift</h1></div>
    <p>Any web page → clean CSV<br />or a summary, with AI.</p>
    <small>Bring your own OpenAI, Anthropic or OpenRouter key</small>
    <div class="grid"><div></div><div style="width:70%"></div><div></div><div style="width:55%"></div></div>
  </body>
</html>
